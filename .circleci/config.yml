version: 2.1
orbs:
  architect: giantswarm/architect@9.6.0

workflows:
  package-and-push-chart-on-tag:
    jobs:
      - architect/push-to-app-catalog:
          context: architect
          name: package and push ailefroide-app chart
          app_catalog: giantswarm-playground-catalog
          app_catalog_test: giantswarm-playground-test-catalog
          chart: ailefroide-app
          filters:
            # Trigger job on git tag.
            tags:
              only: /^v.*/
            branches:
              ignore:
                - main
                - master
  build:
    jobs:
      - architect/go-build:
          # Needed by the default `sign: true`, which mints a GitHub token to
          # resolve repo visibility before signing. Private repos skip signing.
          context: architect
          name: go-build-ailefroide
          # Matches the repo name, which is what devctl will emit here once
          # this config is generated (the template hardcodes the repo name and
          # offers no override). Keeping the two in step means the Dockerfile's
          # COPY source does not have to change again at that point.
          binary: ailefroide-app
          filters:
            # Trigger the job also on git tag.
            tags:
              only: /^v.*/
      - architect/push-to-registries:
          context: architect
          name: push-to-registries
          requires:
            - go-build-ailefroide
          image: giantswarm/ailefroide
          filters:
            # Trigger the job also on git tag.
            tags:
              only: /^v.*/
            branches:
              ignore:
                - main
                - master
