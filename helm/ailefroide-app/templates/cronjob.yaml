---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ailefroide-rotation
  labels:
{{ include "helm.labels" $ | indent 4 }}
spec:
  schedule: {{ .Values.rotation.schedule | quote }}
  concurrencyPolicy: Replace
  jobTemplate:
    spec:
      backoffLimit: 1
      parallelism: 1
      successfulJobsHistoryLimit: 10
      failedJobsHistoryLimit: 3
      template:
        spec:
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          restartPolicy: Never
          imagePullSecrets:
            {{- toYaml .Values.imagePullSecrets | nindent 12 }}
          containers:
          - name: ailefroide
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
            envFrom:
              - secretRef:
                  name: {{ .Values.envSecret.name }}
            command:
              - "/opt/ailefroide"
              - "-config"
              - "/etc/ailefroide/config.yaml"
            {{- if .Values.debug }}
              - "-debug"
            {{ end }}
            securityContext:
              {{- toYaml .Values.securityContext | nindent 14 }}
            resources:
              {{- toYaml .Values.resources | nindent 14 }}
            volumeMounts:
            - name: {{ .Values.configMap.name }}
              mountPath: "/etc/ailefroide"
              readOnly: true
          volumes:
          - name: {{ .Values.configMap.name }}
            configMap:
              name: {{ .Values.configMap.name }}

