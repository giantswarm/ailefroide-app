---
apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: ailefroide-rotation
  labels:
{{ include "helm.labels" $ | indent 4 }}
spec:
  schedule: {{ .Values.rotation.schedule | quote }}
  concurrencyPolicy: Replace
  jobTemplate:
    spec:
      backoffLimit: 1
      parallelism: 1
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: slackhandlerotation
            image: {{ .Values.image.repository }}
            envFrom:
              - secretRef:
                  name: {{ .Values.envSecret.name }}
            command:
              - /opt/ailefroid
              - -config
              - /etc/ailefroide/config.yaml
              - -debug
              - {{ .Values.debug }}
            securityContext:
              {{- toYaml .Values.securityContext | nindent 14 }}
            resources:
              {{- toYaml .Values.resources | nindent 14 }}
            volumeMounts:
            - name: {{ .Values.configMap.name }}
              mountPath: "/etc/ailefroide"
              readOnly: true
          volumes:
          - name: {{ .Values.configMap.name }}
            configMap:
              name: {{ .Values.configMap.name }}

